name: Test HandSpace v0.4.1

on:
  workflow_dispatch:
  push:
    branches:
      - test-v041-sdk
      - ar-dev

permissions:
  contents: read

jobs:
  test:
    name: Test and Build v0.4.1
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HandSpace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download MediaPipe model
        run: |
          chmod +x scripts/download_model.sh
          ./scripts/download_model.sh

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HandSpace-v0.4.1-debug
          path: HandSpace/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
